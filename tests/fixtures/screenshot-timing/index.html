<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture · screenshot timing</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #008000;
      }

      #change {
        position: fixed;
        left: 100px;
        top: 100px;
        width: 100px;
        height: 40px;
        border: 0;
        background: #008000;
        color: #ffffff;
        font: 14px system-ui, sans-serif;
      }

      #change:focus {
        background: #ff0000;
      }
    </style>
  </head>
  <body>
    <button id="change" type="button">Focus changes this button to red</button>
  </body>
</html>
